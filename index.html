<body>
  <div id="root"></div>
  <!-- 液態玻璃的折射濾鏡（backdrop-filter: url(#lens) 用；見 CLAUDE.md 決策 26）。Chrome 支援，其他瀏覽器自動退成一般模糊 -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="lens" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feImage href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='100' height='100' preserveAspectRatio='none'%3E%3Cdefs%3E%3ClinearGradient id='h' x1='0' x2='1'%3E%3Cstop offset='0' stop-color='rgb(52,0,0)'/%3E%3Cstop offset='.16' stop-color='rgb(128,0,0)'/%3E%3Cstop offset='.84' stop-color='rgb(128,0,0)'/%3E%3Cstop offset='1' stop-color='rgb(204,0,0)'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' fill='url(%23h)'/%3E%3C/svg%3E" preserveAspectRatio="none" result="mapX"/>
      <feImage href="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='100' height='100' preserveAspectRatio='none'%3E%3Cdefs%3E%3ClinearGradient id='v' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='rgb(0,52,0)'/%3E%3Cstop offset='.24' stop-color='rgb(0,128,0)'/%3E%3Cstop offset='.76' stop-color='rgb(0,128,0)'/%3E%3Cstop offset='1' stop-color='rgb(0,204,0)'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' fill='url(%23v)'/%3E%3C/svg%3E" preserveAspectRatio="none" result="mapY"/>
      <feComposite in="mapX" in2="mapY" operator="arithmetic" k2="1" k3="1" result="map"/>
      <feDisplacementMap in="SourceGraphic" in2="map" scale="30" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="app.jsx"></script>
</body>
</html>
