# 每天讀一次 Supabase 資料庫，避免免費版因為 7 天沒活動被自動暫停。
#
# 內容安全：只用到 config.js 裡本來就公開的網址與 anon key，
# 不含任何密碼或 service_role 金鑰。絕對不要把那些放進這個檔案。
#
# 失敗時（專案被暫停／刪除、網路問題）這個工作會顯示紅燈，
# GitHub 會寄信通知。手動測試：repo 的 Actions 分頁 → Supabase keep-alive → Run workflow。

name: Supabase keep-alive

on:
  schedule:
    - cron: "17 3 * * *"   # 每天 03:17 UTC（台灣 11:17）。避開整點，GitHub 在整點較擠
  workflow_dispatch:        # 允許手動按鈕觸發

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo (to read config.js)
        uses: actions/checkout@v4

      - name: Query the projects table
        run: |
          URL=$(grep -o 'https://[a-z0-9]*\.supabase\.co' config.js | head -n 1)
          KEY=$(grep -o 'eyJ[A-Za-z0-9._-]*' config.js | head -n 1)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then
            echo "Could not read Supabase URL / key from config.js" >&2
            exit 1
          fi
          # --fail：HTTP 狀態不是 2xx 就讓工作失敗（紅燈 + 寄信）
          curl --fail --silent --show-error --max-time 30 \
            "$URL/rest/v1/projects?select=id&limit=1" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY"
          echo
          echo "OK: queried $URL"
